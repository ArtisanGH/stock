<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#1a1a2e"/>
<title>Artisan — Reporte de Stock</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;min-height:100vh;padding-bottom:3rem}
.app{max-width:480px;margin:0 auto;padding:1.5rem 1rem 3rem}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem}
.logo-mark{width:36px;height:36px;background:#1a1a2e;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;letter-spacing:1px}
.logo-text{font-size:15px;font-weight:600;color:#1a1a2e}
.logo-sub{font-size:12px;color:#888}
.card{background:#fff;border:1px solid #e8e6e0;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.step-label{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.4rem}
.field-label{font-size:14px;font-weight:500;color:#1a1a2e;margin-bottom:.5rem;display:block}
input,select,textarea{width:100%;font-size:15px;padding:10px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a2e;margin-bottom:1rem;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1a1a2e}
textarea{resize:vertical;min-height:72px;margin-bottom:0}
.rut-row{display:flex;gap:8px;align-items:flex-start}
.rut-row input{margin-bottom:0}
.btn-buscar{padding:10px 16px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;height:42px}
.btn-buscar:active{background:#2d2d4e}
.id-card{background:#f5f4f0;border-radius:8px;padding:.75rem 1rem;margin-bottom:1rem;display:none}
.id-name{font-size:15px;font-weight:600;color:#1a1a2e}
.id-meta{font-size:13px;color:#666;margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:4px}
.badge-jumbo{background:#E6F1FB;color:#185FA5}
.badge-walmart{background:#EAF3DE;color:#3B6D11}
.badge-tottus{background:#FAEEDA;color:#854F0B}
.badge-unimarc{background:#FBEAF0;color:#993556}
.badge-supervisor{background:#1a1a2e;color:#fff}
.prod-item{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prod-item select{margin:0;font-size:13px;flex:1}
.stock-mini{display:flex;gap:4px;flex-shrink:0}
.stock-mini button{padding:7px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:14px}
.stock-mini button.sel-r{background:#FCEBEB;border-color:#E24B4A}
.stock-mini button.sel-y{background:#FAEEDA;border-color:#EF9F27}
.del-btn{padding:6px 8px;border:none;background:none;cursor:pointer;color:#bbb;font-size:18px;flex-shrink:0}
.add-btn{width:100%;padding:10px;border:1px dashed #ccc;border-radius:8px;background:transparent;color:#888;font-size:14px;cursor:pointer;margin-bottom:.5rem}
.add-btn:active{background:#f5f4f0}
.foto-area{border:1px dashed #ccc;border-radius:8px;padding:1.25rem;text-align:center;cursor:pointer;margin-bottom:1rem;position:relative;background:#fafafa}
.foto-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.foto-thumb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.5rem;justify-content:center}
.foto-thumb img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid #e8e6e0}
.foto-label{font-size:13px;color:#888}
.submit-btn{width:100%;padding:15px;background:#1a1a2e;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:.5rem}
.submit-btn:active{background:#2d2d4e}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.error-msg{font-size:12px;color:#c0392b;margin-top:4px;margin-bottom:8px;display:none}
.success{display:none;text-align:center;padding:3rem 1rem}
.success h2{font-size:22px;font-weight:600;color:#1a1a2e;margin:1rem 0 .5rem}
.success p{font-size:14px;color:#666;margin-bottom:1.5rem;line-height:1.6}
.nuevo-btn{padding:13px 28px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer}
.hidden{display:none!important}
</style>

<div class="app">
  <div class="logo">
    <div class="logo-mark">AR</div>
    <div>
      <div class="logo-text">Artisan</div>
      <div class="logo-sub">Reporte de stock en tienda</div>
    </div>
  </div>

  <div id="form-view">
    <div class="card">
      <div class="step-label">Paso 1 — Identificación</div>
      <label class="field-label">Ingresa tu RUT</label>
      <div class="rut-row">
        <input type="text" id="rut-input" placeholder="Ej: 12345678-9" maxlength="12" inputmode="text" autocomplete="off"/>
        <button class="btn-buscar" onclick="buscarRut()">Buscar</button>
      </div>
      <div id="rut-error" class="error-msg">RUT no encontrado. Verifica o contacta a tu supervisor.</div>
      <div class="id-card" id="id-card">
        <div class="id-name" id="id-nombre"></div>
        <div class="id-meta" id="id-meta"></div>
      </div>
    </div>

    <!-- Solo visible para supervisores -->
    <div class="card hidden" id="supervisor-card">
      <div class="step-label">Selección de tienda</div>
      <label class="field-label">Cadena</label>
      <select id="sup-cadena" onchange="onCambiarCadenaSupervisor()">
        <option value="">— Selecciona cadena —</option>
        <option value="Jumbo">Jumbo</option>
        <option value="Walmart">Walmart / Líder</option>
        <option value="Tottus">Tottus</option>
        <option value="Unimarc">Unimarc</option>
      </select>
      <label class="field-label">Local</label>
      <select id="sup-local">
        <option value="">— Primero elige cadena —</option>
      </select>
    </div>

    <div class="card hidden" id="productos-card">
      <div class="step-label">Paso 2 — Productos con problema</div>
      <label class="field-label">Solo productos con stock bajo o sin stock</label>
      <div id="productos-list"></div>
      <button class="add-btn" onclick="agregarProducto()">+ Agregar otro producto</button>
    </div>

    <div class="card hidden" id="foto-card">
      <div class="step-label">Paso 3 — Foto y observaciones (opcional)</div>
      <div class="foto-area">
        <input type="file" accept="image/*" multiple onchange="previewFotos(event)"/>
        <div class="foto-thumb" id="foto-thumb"></div>
        <div class="foto-label"><i class="ti ti-camera"></i> Toca para sacar o subir foto</div>
      </div>
      <label class="field-label">Observaciones</label>
      <textarea id="obs" placeholder="Comentarios sobre la tienda o los productos..."></textarea>
    </div>

    <button class="submit-btn hidden" id="submit-btn" onclick="enviarReporte()">Enviar reporte</button>
  </div>

  <div class="success" id="success-view">
    <i class="ti ti-circle-check" style="font-size:56px;color:#1D9E75"></i>
    <h2>Reporte enviado</h2>
    <p id="success-msg"></p>
    <button class="nuevo-btn" onclick="nuevoReporte()">Nuevo reporte</button>
  </div>
</div>

function normalizarRut(r){ return r.replace(/\./g,'').replace(/\s/g,'').toUpperCase(); }

function buscarRut(){
  const val = normalizarRut(document.getElementById('rut-input').value.trim());
  if(!val) return;

  const errEl = document.getElementById('rut-error');
  const idCard = document.getElementById('id-card');

  // Buscar en supervisores primero
  const sup = SUPERVISORES.find(s => normalizarRut(s.rut) === val);
  if(sup){
    errEl.style.display='none';
    esSupervisor = true;
    reponedorActual = {rut: sup.rut, nombre: sup.nombre, local:'', cadena:''};
    document.getElementById('id-nombre').textContent = sup.nombre;
    document.getElementById('id-meta').innerHTML = '<span class="badge badge-supervisor">Supervisor</span>';
    idCard.style.display='block';
    document.getElementById('supervisor-card').classList.remove('hidden');
    document.getElementById('foto-card').classList.remove('hidden');
    document.getElementById('productos-card').classList.add('hidden');
    document.getElementById('submit-btn').classList.add('hidden');
    document.getElementById('productos-list').innerHTML='';
    return;
  }

  // Buscar en reponedores
  const found = REPONEDORES.find(r => normalizarRut(r.rut) === val);
  if(!found){
    errEl.style.display='block';
    idCard.style.display='none';
    document.getElementById('supervisor-card').classList.add('hidden');
    document.getElementById('productos-card').classList.add('hidden');
    document.getElementById('foto-card').classList.add('hidden');
    document.getElementById('submit-btn').classList.add('hidden');
    reponedorActual=null; esSupervisor=false; return;
  }

  errEl.style.display='none';
  esSupervisor = false;
  reponedorActual = found;
  document.getElementById('id-nombre').textContent = found.nombre;
  const bc = found.cadena==='Jumbo'?'badge-jumbo': found.cadena==='Walmart'?'badge-walmart': found.cadena==='Tottus'?'badge-tottus':'badge-unimarc';
  document.getElementById('id-meta').innerHTML = found.local + '<span class="badge '+bc+'">'+found.cadena+'</span>';
  idCard.style.display='block';
  document.getElementById('supervisor-card').classList.add('hidden');
  document.getElementById('productos-card').classList.remove('hidden');
  document.getElementById('foto-card').classList.remove('hidden');
  document.getElementById('submit-btn').classList.remove('hidden');
  document.getElementById('productos-list').innerHTML='';
  prodCount=0;
  agregarProducto();
}

document.getElementById('rut-input').addEventListener('keydown',function(e){ if(e.key==='Enter') buscarRut(); });

function onCambiarCadenaSupervisor(){
  const cadena = document.getElementById('sup-cadena').value;
  const selLocal = document.getElementById('sup-local');
  selLocal.innerHTML = '<option value="">— Selecciona local —</option>';
  if(!cadena) return;
  (LOCALES[cadena]||[]).forEach(l=>{
    const o=document.createElement('option'); o.value=l; o.textContent=l; selLocal.appendChild(o);
  });
  // Actualizar productos
  reponedorActual.cadena = cadena;
  reponedorActual.local = '';
  document.getElementById('productos-list').innerHTML='';
  prodCount=0;
  document.getElementById('productos-card').classList.remove('hidden');
  document.getElementById('submit-btn').classList.add('hidden');
  agregarProducto();

  selLocal.onchange = function(){
    reponedorActual.local = this.value;
    if(this.value) document.getElementById('submit-btn').classList.remove('hidden');
    else document.getElementById('submit-btn').classList.add('hidden');
  };
}

function agregarProducto(){
  if(!reponedorActual || !reponedorActual.cadena) return;
  const prods = PRODUCTOS[reponedorActual.cadena]||[];
  prodCount++;
  const id='prod-'+prodCount;
  const div=document.createElement('div');
  div.className='prod-item'; div.id=id;
  const opts=prods.map(p=>'<option value="'+p+'">'+p+'</option>').join('');
  div.innerHTML='<select style="flex:1;margin:0;font-size:13px"><option value="">— Selecciona producto —</option>'+opts+'</select>'
    +'<div class="stock-mini">'
    +'<button type="button" onclick="setStock(this,\'rojo\')" title="Sin stock">🔴</button>'
    +'<button type="button" onclick="setStock(this,\'amarillo\')" title="Stock bajo (1-9)">🟡</button>'
    +'</div>'
    +'<button type="button" class="del-btn" onclick="document.getElementById(\''+id+'\').remove()" title="Eliminar"><i class="ti ti-x"></i></button>';
  document.getElementById('productos-list').appendChild(div);
}

function setStock(btn,tipo){
  const mini=btn.parentElement;
  mini.querySelectorAll('button').forEach(b=>b.classList.remove('sel-r','sel-y'));
  btn.classList.add(tipo==='rojo'?'sel-r':'sel-y');
}

function previewFotos(e){
  fotosSeleccionadas=Array.from(e.target.files);
  const thumb=document.getElementById('foto-thumb');
  thumb.innerHTML='';
  fotosSeleccionadas.forEach(f=>{
    const img=document.createElement('img'); img.src=URL.createObjectURL(f); thumb.appendChild(img);
  });
}

function enviarReporte(){
  if(!reponedorActual) return;
  if(esSupervisor && !reponedorActual.local){ alert('Selecciona un local antes de enviar.'); return; }
  const items=document.querySelectorAll('#productos-list .prod-item');
  const productos=[];
  items.forEach(item=>{
    const sel=item.querySelector('select');
    const stockBtn=item.querySelector('.stock-mini button.sel-r,.stock-mini button.sel-y');
    if(sel.value && stockBtn){
      productos.push({producto:sel.value, stock:stockBtn.classList.contains('sel-r')?'Sin stock (0 unidades)':'Stock bajo (1-9 unidades)'});
    }
  });
  if(productos.length===0){ alert('Selecciona al menos un producto y su nivel de stock.'); return; }

  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='Enviando...';

  const ahora=new Date().toLocaleString('es-CL');
  const filas=productos.map(p=>({
    timestamp:ahora,
    nombre:reponedorActual.nombre,
    rut:reponedorActual.rut,
    cadena:reponedorActual.cadena,
    local:reponedorActual.local,
    producto:p.producto,
    stock:p.stock,
    observaciones:document.getElementById('obs').value||'',
    fotos:fotosSeleccionadas.length+' foto(s)'
  }));

  fetch(SHEET_URL,{method:'POST',body:JSON.stringify({reportes:filas}),headers:{'Content-Type':'application/json'},mode:'no-cors'})
    .then(()=>mostrarExito(productos.length))
    .catch(()=>mostrarExito(productos.length));
}

function mostrarExito(n){
  document.getElementById('form-view').style.display='none';
  document.getElementById('success-view').style.display='block';
  document.getElementById('success-msg').textContent='Se registraron '+n+' producto(s) con problema de stock en '+reponedorActual.local+'.';
}

function nuevoReporte(){
  document.getElementById('form-view').style.display='block';
  document.getElementById('success-view').style.display='none';
  document.getElementById('rut-input').value='';
  document.getElementById('id-card').style.display='none';
  document.getElementById('supervisor-card').classList.add('hidden');
  document.getElementById('productos-card').classList.add('hidden');
  document.getElementById('foto-card').classList.add('hidden');
  document.getElementById('submit-btn').classList.add('hidden');
  document.getElementById('submit-btn').disabled=false;
  document.getElementById('submit-btn').textContent='Enviar reporte';
  document.getElementById('obs').value='';
  document.getElementById('foto-thumb').innerHTML='';
  document.getElementById('sup-cadena').value='';
  document.getElementById('sup-local').innerHTML='<option value="">— Primero elige cadena —</option>';
  fotosSeleccionadas=[]; reponedorActual=null; esSupervisor=false; prodCount=0;
}
</script>
</body>
</html>
